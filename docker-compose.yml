# Local data plane: migrations use the direct Postgres 5432 connection because DDL
# and advisory locks are not pooling-safe; the application uses PgBouncer on 6432.
services:
  postgres:
    image: postgres:16
    container_name: coffeeshop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coffeeshop
      POSTGRES_PASSWORD: coffeeshop
      POSTGRES_DB: coffeeshop
    volumes:
      - coffeeshop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeshop -d coffeeshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    # edoburu/pgbouncer is actively published on Docker Hub; the bitnami pgbouncer tags
    # were removed/relocated in 2025. Transaction pooling in front of postgres on 6432.
    image: edoburu/pgbouncer:v1.23.1-p2
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: coffeeshop
      DB_PASSWORD: coffeeshop
      DB_NAME: coffeeshop
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The edoburu image ships sh (no bash) plus pg_isready; use it to confirm the pooler is accepting.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U coffeeshop"]
      interval: 5s
      timeout: 5s
      retries: 10

# The app should connect to PgBouncer (6432) rather than Postgres (5432) directly.
# To set the tenant context, the application runs at the start of each transaction:
#   SET LOCAL app.tenant_id = '<tenant-uuid>';
# PgBouncer's transaction mode is required because session-mode would hold the setting
# across the connection's lifetime, which is incompatible with connection pooling.
# See: coffee-scheduler/docs/schema.md §5 and F60 tenant isolation policy.

# The app container's DATABASE_URL should point at 127.0.0.1:6432, e.g.
# postgresql://coffeeshop:coffeeshop@127.0.0.1:6432/coffeeshop
#
# When running via Docker Compose:
#   docker compose up
#   # then in another shell:
#   docker compose exec app psql -U coffeeshop -d coffeeshop -c "SET LOCAL app.tenant_id = '<uuid>'"
#
# If the app.tenant_id is unset or empty, RLS matches no rows (fail-closed, per the
# tenant_isolation policy in 0001). This is the desired default — it prevents any
# tenant from reading another tenant's rows even when the setting is missing.

# A restore drill is documented in docs/postgres-backup.md

volumes:
  coffeeshop_pgdata:
