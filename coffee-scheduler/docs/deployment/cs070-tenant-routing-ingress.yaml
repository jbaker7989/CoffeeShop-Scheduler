# CS-070 deployment-evidence template.  This is deliberately declarative: it
# records the ingress invariants that must be proven in the deployment system;
# it does not issue certificates or implement HTTP redirects in the app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coffee-scheduler-tenant-edge
  annotations:
    # The real ingress/controller configuration must redirect plaintext HTTP at
    # the edge and retain the original Host/X-Forwarded-For toward FastAPI.
    cs070.coffeescheduler.com/https-redirect: required-at-edge
    cs070.coffeescheduler.com/forwarded-host: preserve-single-value
spec:
  tls:
    - hosts:
        - coffeescheduler.com
        - '*.coffeescheduler.com'
      secretName: coffeescheduler-wildcard-tls
  rules:
    - host: '*.coffeescheduler.com'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coffee-scheduler-next
                port:
                  number: 3000
---
# Required gateway environment assertions.  Replace the CIDR with the concrete
# ingress/Next egress range; never use 0.0.0.0/0 for trusted proxy forwarding.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coffee-scheduler-routing-config
data:
  TENANT_ROUTING_MODE: production
  TENANT_PLATFORM_SUFFIX: coffeescheduler.com
  TENANT_HTTPS_ENABLED: 'true'
  TRUSTED_PROXY_CIDRS: 10.0.0.0/8
