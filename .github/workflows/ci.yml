name: CI

# The machine gate in coffee-scheduler/test/SKILL.md § "CI/CD shape".
#
# Four cheap jobs run greps against the change; two run the suite against a real Postgres.
# The suite is split because test_migrations_roundtrip.py downgrades to base and wipes the
# database — it cannot share a database with the behavioural tests.
#
# To make this a merge gate, mark all six jobs required in branch protection.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # The suite skips DB-backed tests when DATABASE_URL is unset, so CI sets it explicitly.
  # The owner DSN is what local dev uses; app_rw is exercised by the tests themselves.
  DATABASE_URL: postgresql://coffeeshop:coffeeshop@localhost:5432/coffeeshop
  DATABASE_URL_DIRECT: postgresql+psycopg://coffeeshop:coffeeshop@localhost:5432/coffeeshop

defaults:
  run:
    working-directory: coffee-scheduler

jobs:
  # --- static gates -------------------------------------------------------

  spec-traceability:
    name: Spec-ID traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every changed test cites a spec; every Done AC has a test
        run: python scripts/ci/check_spec_traceability.py --base "origin/${{ github.base_ref || 'main' }}"

  test-first:
    name: Test-first commit guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: The first test commit precedes the first production commit
        run: python scripts/ci/check_test_first.py --base "origin/${{ github.base_ref || 'main' }}"

  spec-lint:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Every acceptance criterion is a single testable assertion
        run: python scripts/ci/spec_lint.py

  review-checklist:
    name: Review checklist (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: No TODOs without an issue, no hardcoded secrets, no commented-out code
        run: python scripts/ci/review_checklist.py --base "origin/${{ github.base_ref || 'main' }}"

  lint:
    name: Lint (new files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: python -m pip install --quiet ruff==0.17.6
      - name: Lint new Python files
        # Ratchet on additions only. The tree carries pre-existing lint debt (278 findings),
        # so linting every modified file would block a two-line edit to a legacy module.
        # New code is held to the pinned config in ruff.toml; edits to old files are
        # covered by the review-checklist job instead.
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          mapfile -t added < <(git diff --name-only --diff-filter=A "$base...HEAD" -- '*.py' | sed 's|^coffee-scheduler/||')
          if [ ${#added[@]} -eq 0 ]; then
            echo "No new Python files; nothing to lint."
            exit 0
          fi
          printf 'Linting %d new file(s):\n' "${#added[@]}"
          printf '  %s\n' "${added[@]}"
          ruff check --config ruff.toml "${added[@]}"

  # --- suite --------------------------------------------------------------

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    needs: [spec-traceability, spec-lint, lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coffeeshop
          POSTGRES_PASSWORD: coffeeshop
          POSTGRES_DB: coffeeshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeeshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            coffee-scheduler/requirements.txt
            coffee-scheduler/otel/requirements.txt
            coffee-scheduler/agents/demand_forecast/requirements-agent.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r otel/requirements.txt
          python -m pip install pytest==9.2.0 PyYAML==6.0.3 httpx==0.28.1
      - name: Install isolated Forecast agent dependencies
        run: |
          python -m venv "$RUNNER_TEMP/coffee-adk"
          "$RUNNER_TEMP/coffee-adk/bin/python" -m pip install -r agents/demand_forecast/requirements-agent.txt
          echo "CS011_ADK_PYTHON=$RUNNER_TEMP/coffee-adk/bin/python" >> "$GITHUB_ENV"
          echo "CS015_TEST_DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Apply migrations
        working-directory: coffee-scheduler/db
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_DIRECT }}
        run: alembic -c alembic.ini upgrade head
      - name: Load seed data
        # Several suites (rules admin, isolation gate, soft delete) assert against the
        # Maven Roasters seed rows, so the ETL must run before them.
        run: python ../scripts/etl_excel_to_postgres.py --database-url "$DATABASE_URL" --tenant-slug maven-demo
      - name: Seed rule templates
        # BUG-058: the onboarding LiveDatabaseTests provision from labor_rule_templates,
        # which is backfilled from the seeded verified NY rule set — must run after the ETL.
        run: python scripts/seed_rule_templates.py --database-url "$DATABASE_URL"
      - name: Run the suite
        # test_migrations_roundtrip.py is excluded: it downgrades to base and wipes the
        # database, so it runs in its own job against a disposable Postgres.
        run: python -m pytest test/ -q --ignore=test/test_migrations_roundtrip.py --durations=10

  migration-roundtrip:
    name: Migration round-trip
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coffeeshop
          POSTGRES_PASSWORD: coffeeshop
          POSTGRES_DB: coffeeshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffeeshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: coffee-scheduler/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.2.0
      - name: Run the destructive migration tests
        # No seed data: these tests only prove the schema survives upgrade → downgrade → upgrade.
        run: python -m pytest test/test_migrations_roundtrip.py -q
